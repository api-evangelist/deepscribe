aid: deepscribe
name: DeepScribe
description: >-
  DeepScribe is a San Francisco, California ambient AI medical scribe
  company that automates clinical documentation and coding for specialty
  healthcare providers. Founded in 2017 (incorporated 2019) by Matthew Ko,
  Kairui Zeng, and Akilesh Bapu, DeepScribe captures the natural
  conversation between clinician and patient and produces structured
  clinical notes inside the provider's existing EHR workflow. The platform
  is HIPAA-compliant and is deployed across more than 1,500 healthcare
  organizations, with reported traction of 8 million+ visits captured and
  a 99.92% note-satisfaction rating. Core products include the AI Medical
  Scribe (ambient documentation), SmartPrep (pre-visit intelligence), AI
  Coding (E/M, ICD-10, and HCC automation), Customization Studio
  (provider-specific note personalization), and DeepScribe Assist
  (point-of-care insights). DeepScribe ships bi-directional EHR
  integrations with Epic, athenahealth, eClinicalWorks, NextGen,
  AdvancedMD, drchrono, ModMed, Flatiron (OncoEMR), Ontada (iKnowMed
  Generation 2), and Objective Medical Systems, with a focused practice
  in oncology, cardiology, gastroenterology, neurology, orthopedics,
  urology, and value-based care. The company partners with AWS, Anthropic,
  Deloitte, and Panda Health for infrastructure, model, and
  go-to-market support. DeepScribe is sold as enterprise SaaS through a
  contact-sales motion; there is no public developer API, SDK, or
  open-source release, and authentication into the clinician workspace
  happens through canvas.deepscribe.ai.
